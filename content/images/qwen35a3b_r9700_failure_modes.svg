<title>qwen35a3b_r9700_failure_modes.svg</title>
<desc>qwen35a3b_r9700_failure_modes.svg</desc>
<style>
    .title { font: 700 32px Inter, Segoe UI, sans-serif; fill: #3b2f2f; }
    .subtitle { font: 500 16px Inter, Segoe UI, sans-serif; fill: #7a6856; }
    .axis { font: 600 14px Inter, Segoe UI, sans-serif; fill: #7a6856; }
    .label { font: 600 18px Inter, Segoe UI, sans-serif; fill: #3b2f2f; }
    .small { font: 500 14px Inter, Segoe UI, sans-serif; fill: #7a6856; }
    .value { font: 700 20px Inter, Segoe UI, sans-serif; fill: #3b2f2f; }
    .mono { font: 600 15px 'IBM Plex Mono', 'SFMono-Regular', monospace; fill: #3b2f2f; }
</style>
<rect width="100%" height="100%" rx="24" fill="#fbf7ef"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b76e79"/></marker></defs><text x="70" y="70" class="title">How the run usually dies</text><text x="70" y="102" class="subtitle">Three distinct failure paths showed up in the logs.</text><rect x="90" y="170" width="240" height="82" rx="18" fill="white" stroke="#e7dccb" stroke-width="2"/><text x="108" y="200" class="label">Stale VRAM after failed</text><text x="108" y="222" class="small">run</text><rect x="420" y="170" width="240" height="82" rx="18" fill="#f1e7d8" stroke="#e7dccb" stroke-width="2"/><text x="438" y="200" class="label">Orphaned VLLM::Worker_TP</text><text x="438" y="222" class="small">and resource_tracker</text><text x="438" y="244" class="small">processes keep memory</text><text x="438" y="266" class="small">reserved</text><rect x="770" y="170" width="240" height="82" rx="18" fill="white" stroke="#e7dccb" stroke-width="2"/><text x="788" y="200" class="label">Next startup fails before</text><text x="788" y="222" class="small">serving begins</text><line x1="330" y1="211" x2="420" y2="211" stroke="#b76e79" stroke-width="4" marker-end="url(#arrow)"/><line x1="660" y1="211" x2="770" y2="211" stroke="#b76e79" stroke-width="4" marker-end="url(#arrow)"/><rect x="90" y="315" width="240" height="82" rx="18" fill="white" stroke="#e7dccb" stroke-width="2"/><text x="108" y="345" class="label">Longer or repeated traffic</text><rect x="420" y="315" width="240" height="82" rx="18" fill="#f1e7d8" stroke="#e7dccb" stroke-width="2"/><text x="438" y="345" class="label">Shared-memory TP gather</text><text x="438" y="367" class="small">path trips on</text><text x="438" y="389" class="small">/vllm_tp_gather_1_to_0</text><rect x="770" y="315" width="240" height="82" rx="18" fill="white" stroke="#e7dccb" stroke-width="2"/><text x="788" y="345" class="label">EngineDeadError during</text><text x="788" y="367" class="small">actual serving</text><line x1="330" y1="356" x2="420" y2="356" stroke="#b76e79" stroke-width="4" marker-end="url(#arrow)"/><line x1="660" y1="356" x2="770" y2="356" stroke="#b76e79" stroke-width="4" marker-end="url(#arrow)"/><rect x="90" y="460" width="240" height="82" rx="18" fill="white" stroke="#e7dccb" stroke-width="2"/><text x="108" y="490" class="label">Relaunch after partial</text><text x="108" y="512" class="small">success</text><rect x="420" y="460" width="240" height="82" rx="18" fill="#f1e7d8" stroke="#e7dccb" stroke-width="2"/><text x="438" y="490" class="label">Workers die after load and</text><text x="438" y="512" class="small">KV-cache init before</text><text x="438" y="534" class="small">readiness</text><rect x="770" y="460" width="240" height="82" rx="18" fill="white" stroke="#e7dccb" stroke-width="2"/><text x="788" y="490" class="label">Health endpoint never</text><text x="788" y="512" class="small">stabilizes</text><line x1="330" y1="501" x2="420" y2="501" stroke="#b76e79" stroke-width="4" marker-end="url(#arrow)"/><line x1="660" y1="501" x2="770" y2="501" stroke="#b76e79" stroke-width="4" marker-end="url(#arrow)"/><rect x="90" y="610" width="920" height="42" rx="14" fill="white" stroke="#e7dccb"/><text x="118" y="638" class="mono">Bottom line: the happy path exists, but the crash path is still sitting right next to it.</text>
</svg>