<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="800" fill="#F4F3EE"/>

  <!-- Title -->
  <text x="600" y="55" font-family="Georgia, serif" font-size="36" font-weight="400" fill="#1A1612" text-anchor="middle">The Human Bottleneck</text>
  <text x="600" y="90" font-family="Georgia, serif" font-size="18" fill="#5C534A" text-anchor="middle" font-style="italic">From AI Paper to Production Deployment</text>

  <!-- Decorative line -->
  <line x1="400" y1="110" x2="800" y2="110" stroke="#E5E2DC" stroke-width="1"/>

  <!-- Funnel -->
  <g transform="translate(400, 140)">
    <!-- Stage 1: Find -->
    <polygon points="0,0 400,0 370,90 30,90" fill="#E8E3DB" stroke="#B1ADA1" stroke-width="1"/>
    <text x="200" y="55" font-family="Georgia, serif" font-size="20" font-weight="600" fill="#1A1612" text-anchor="middle">FIND</text>

    <!-- Stage 2: Understand -->
    <polygon points="30,100 370,100 320,190 80,190" fill="#E0DAD0" stroke="#B1ADA1" stroke-width="1"/>
    <text x="200" y="155" font-family="Georgia, serif" font-size="20" font-weight="600" fill="#1A1612" text-anchor="middle">UNDERSTAND</text>

    <!-- Stage 3: Implement -->
    <polygon points="80,200 320,200 260,290 140,290" fill="#D8D1C5" stroke="#B1ADA1" stroke-width="1"/>
    <text x="200" y="255" font-family="Georgia, serif" font-size="20" font-weight="600" fill="#1A1612" text-anchor="middle">IMPLEMENT</text>

    <!-- Stage 4: Optimize (bottleneck) -->
    <polygon points="140,300 260,300 230,420 170,420" fill="#C15F3C" stroke="#A04E30" stroke-width="2"/>
    <text x="200" y="350" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">OPTIMIZE</text>
    <text x="200" y="375" font-family="Georgia, serif" font-size="13" fill="#FFFFFF" text-anchor="middle">(GPU Kernels)</text>
  </g>

  <!-- Side annotations -->
  <g transform="translate(80, 175)">
    <rect x="0" y="0" width="260" height="70" rx="4" fill="#FFFFFF" stroke="#E5E2DC" stroke-width="1"/>
    <text x="20" y="25" font-family="Georgia, serif" font-size="14" font-weight="600" fill="#1A1612">Papers, tweets, Discord</text>
    <text x="20" y="50" font-family="Georgia, serif" font-size="13" fill="#5C534A">Cutting edge isn't always on arXiv</text>
  </g>

  <g transform="translate(860, 245)">
    <rect x="0" y="0" width="260" height="70" rx="4" fill="#FFFFFF" stroke="#E5E2DC" stroke-width="1"/>
    <text x="20" y="25" font-family="Georgia, serif" font-size="14" font-weight="600" fill="#1A1612">Math, implementation details</text>
    <text x="20" y="50" font-family="Georgia, serif" font-size="13" fill="#5C534A">Dense papers, varied notation</text>
  </g>

  <g transform="translate(80, 345)">
    <rect x="0" y="0" width="260" height="70" rx="4" fill="#FFFFFF" stroke="#E5E2DC" stroke-width="1"/>
    <text x="20" y="25" font-family="Georgia, serif" font-size="14" font-weight="600" fill="#1A1612">PyTorch prototype</text>
    <text x="20" y="50" font-family="Georgia, serif" font-size="13" fill="#5C534A">A weekend if you're good</text>
  </g>

  <!-- Bottleneck annotation -->
  <g transform="translate(860, 420)">
    <rect x="0" y="0" width="280" height="100" rx="4" fill="#FBF7F4" stroke="#C15F3C" stroke-width="2"/>
    <text x="20" y="28" font-family="Georgia, serif" font-size="15" font-weight="600" fill="#C15F3C">THE BOTTLENECK</text>
    <text x="20" y="52" font-family="Georgia, serif" font-size="13" fill="#5C534A">This is where most people give up.</text>
    <text x="20" y="75" font-family="Georgia, serif" font-size="13" fill="#8C8279">Requires rare expertise in GPU</text>
    <text x="20" y="92" font-family="Georgia, serif" font-size="13" fill="#8C8279">architecture and optimization</text>
  </g>

  <!-- Expertise gap -->
  <g transform="translate(250, 580)">
    <rect x="0" y="0" width="700" height="100" rx="4" fill="#FFFFFF" stroke="#E5E2DC" stroke-width="1"/>

    <text x="350" y="30" font-family="Georgia, serif" font-size="18" font-weight="600" fill="#1A1612" text-anchor="middle">The Expertise Gap</text>

    <g transform="translate(50, 50)">
      <circle cx="10" cy="10" r="6" fill="#C15F3C"/>
      <text x="30" y="15" font-family="Georgia, serif" font-size="20" font-weight="600" fill="#C15F3C">&lt; 1,000</text>
      <text x="130" y="15" font-family="Georgia, serif" font-size="14" fill="#5C534A">production CUDA experts</text>
    </g>

    <g transform="translate(380, 50)">
      <circle cx="15" cy="10" r="15" fill="#B1ADA1" opacity="0.5"/>
      <text x="45" y="15" font-family="Georgia, serif" font-size="20" font-weight="600" fill="#5C534A">1,000,000+</text>
      <text x="180" y="15" font-family="Georgia, serif" font-size="14" fill="#5C534A">ML engineers</text>
    </g>
  </g>

  <!-- Key question -->
  <rect x="250" y="710" width="700" height="55" rx="4" fill="#FBF7F4" stroke="#C15F3C" stroke-width="1"/>
  <text x="600" y="745" font-family="Georgia, serif" font-size="18" fill="#C15F3C" text-anchor="middle" font-style="italic">What if we could automate the bottleneck?</text>
</svg>