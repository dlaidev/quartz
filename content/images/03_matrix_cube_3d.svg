<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="800" fill="#F4F3EE"/>

  <!-- Title -->
  <text x="600" y="55" font-family="Georgia, serif" font-size="36" font-weight="400" fill="#1A1612" text-anchor="middle">Matrix Multiplication is 3D</text>
  <text x="600" y="90" font-family="Georgia, serif" font-size="18" fill="#5C534A" text-anchor="middle" font-style="italic">Each result cell anchors a vector through the cube</text>

  <!-- Decorative line -->
  <line x1="400" y1="110" x2="800" y2="110" stroke="#E5E2DC" stroke-width="1"/>

  <!-- Isometric cube - center at (550, 380) -->
  <g transform="translate(550, 380)">
    <!-- Left face (Matrix L) - warm tan -->
    <polygon points="-180,90 -180,-90 0,-180 0,0" fill="#E8E0D5" stroke="#B1ADA1" stroke-width="2"/>

    <!-- Right face (Matrix R) - slightly cooler -->
    <polygon points="0,0 0,-180 180,-90 180,90" fill="#DDD8D0" stroke="#B1ADA1" stroke-width="2"/>

    <!-- Top face (Result) - lightest -->
    <polygon points="-180,-90 0,-180 180,-90 0,0" fill="#F0EBE3" stroke="#B1ADA1" stroke-width="2"/>

    <!-- Grid lines on left face -->
    <g stroke="#B1ADA1" stroke-width="0.5" opacity="0.6">
      <line x1="-180" y1="0" x2="0" y2="-90"/>
      <line x1="-135" y1="90" x2="-135" y2="-90"/>
      <line x1="-90" y1="90" x2="-90" y2="-90"/>
      <line x1="-45" y1="90" x2="-45" y2="-90"/>
      <line x1="-180" y1="45" x2="0" y2="-45"/>
      <line x1="-180" y1="-45" x2="0" y2="-135"/>
    </g>

    <!-- Grid lines on right face -->
    <g stroke="#B1ADA1" stroke-width="0.5" opacity="0.6">
      <line x1="0" y1="-90" x2="180" y2="0"/>
      <line x1="45" y1="-90" x2="45" y2="90"/>
      <line x1="90" y1="-90" x2="90" y2="90"/>
      <line x1="135" y1="-90" x2="135" y2="90"/>
      <line x1="0" y1="-45" x2="180" y2="45"/>
      <line x1="0" y1="45" x2="180" y2="135" opacity="0"/>
    </g>

    <!-- Grid lines on top face -->
    <g stroke="#B1ADA1" stroke-width="0.5" opacity="0.6">
      <line x1="-135" y1="-90" x2="45" y2="-90"/>
      <line x1="-90" y1="-90" x2="90" y2="-90"/>
      <line x1="-45" y1="-90" x2="135" y2="-90"/>
      <line x1="-90" y1="-135" x2="-90" y2="-45"/>
      <line x1="0" y1="-135" x2="0" y2="-45"/>
      <line x1="90" y1="-135" x2="90" y2="-45"/>
    </g>

    <!-- Highlighted result cell -->
    <polygon points="-45,-112 0,-135 45,-112 0,-90" fill="#C15F3C" fill-opacity="0.8" stroke="#C15F3C" stroke-width="2"/>

    <!-- Vector through cube (k dimension) -->
    <line x1="0" y1="-112" x2="0" y2="68" stroke="#C15F3C" stroke-width="3" stroke-dasharray="6,4"/>
    <circle cx="0" cy="-112" r="5" fill="#C15F3C"/>
    <circle cx="0" cy="68" r="4" fill="#C15F3C" opacity="0.5"/>

    <!-- Matrix labels -->
    <text x="-160" y="0" font-family="Georgia, serif" font-size="22" font-weight="600" fill="#5C534A" text-anchor="middle">L</text>
    <text x="160" y="0" font-family="Georgia, serif" font-size="22" font-weight="600" fill="#5C534A" text-anchor="middle">R</text>
    <text x="0" y="-200" font-family="Georgia, serif" font-size="18" font-weight="600" fill="#C15F3C" text-anchor="middle">Result</text>

    <!-- Axis labels -->
    <text x="-200" y="110" font-family="Georgia, serif" font-size="14" fill="#8C8279">i (rows)</text>
    <text x="170" y="115" font-family="Georgia, serif" font-size="14" fill="#8C8279">j (cols)</text>
    <text x="15" y="85" font-family="Georgia, serif" font-size="14" fill="#C15F3C" font-style="italic">k</text>
  </g>

  <!-- Explanation cards -->
  <g transform="translate(800, 200)">
    <rect x="0" y="0" width="320" height="100" rx="4" fill="#FFFFFF" stroke="#E5E2DC" stroke-width="1"/>
    <text x="20" y="30" font-family="Georgia, serif" font-size="15" font-weight="600" fill="#1A1612">Left Matrix (L)</text>
    <text x="20" y="55" font-family="Georgia, serif" font-size="13" fill="#5C534A">Rows extend along i</text>
    <text x="20" y="75" font-family="Georgia, serif" font-size="13" fill="#5C534A">Columns extend along k</text>
  </g>

  <g transform="translate(800, 320)">
    <rect x="0" y="0" width="320" height="100" rx="4" fill="#FFFFFF" stroke="#E5E2DC" stroke-width="1"/>
    <text x="20" y="30" font-family="Georgia, serif" font-size="15" font-weight="600" fill="#1A1612">Right Matrix (R)</text>
    <text x="20" y="55" font-family="Georgia, serif" font-size="13" fill="#5C534A">Rows extend along k</text>
    <text x="20" y="75" font-family="Georgia, serif" font-size="13" fill="#5C534A">Columns extend along j</text>
  </g>

  <g transform="translate(800, 440)">
    <rect x="0" y="0" width="320" height="100" rx="4" fill="#FBF7F4" stroke="#C15F3C" stroke-width="1"/>
    <text x="20" y="30" font-family="Georgia, serif" font-size="15" font-weight="600" fill="#C15F3C">The Dot Product</text>
    <text x="20" y="55" font-family="Georgia, serif" font-size="13" fill="#5C534A">Along k dimension, elements</text>
    <text x="20" y="75" font-family="Georgia, serif" font-size="13" fill="#5C534A">meet, multiply, and sum</text>
  </g>

  <!-- Key insight at bottom -->
  <rect x="150" y="620" width="900" height="80" rx="4" fill="#FFFFFF" stroke="#E5E2DC" stroke-width="1"/>
  <text x="600" y="655" font-family="Georgia, serif" font-size="17" fill="#1A1612" text-anchor="middle">
    <tspan font-weight="600" fill="#C15F3C">GPU Insight:</tspan>
    <tspan> We can't fit the whole cube in fast memory.</tspan>
  </text>
  <text x="600" y="685" font-family="Georgia, serif" font-size="17" fill="#5C534A" text-anchor="middle">We must TILE it. The tile SIZE is what we're searching for.</text>
</svg>