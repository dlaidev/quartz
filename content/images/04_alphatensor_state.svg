<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="800" fill="#F4F3EE"/>

  <!-- Title -->
  <text x="600" y="55" font-family="Georgia, serif" font-size="36" font-weight="400" fill="#1A1612" text-anchor="middle">AlphaTensor: The TensorGame</text>
  <text x="600" y="90" font-family="Georgia, serif" font-size="18" fill="#5C534A" text-anchor="middle" font-style="italic">Algorithm Discovery as a Game · DeepMind, Nature 2022</text>

  <!-- Decorative line -->
  <line x1="350" y1="110" x2="850" y2="110" stroke="#E5E2DC" stroke-width="1"/>

  <!-- LEFT COLUMN: Tensor visualization -->
  <g transform="translate(100, 150)">
    <!-- Section label -->
    <text x="130" y="0" font-family="Georgia, serif" font-size="16" font-weight="600" fill="#1A1612" text-anchor="middle">Tensor State</text>

    <!-- 4x4 grid with 3D effect -->
    <g transform="translate(0, 25)">
      <!-- Main grid -->
      <rect x="0" y="0" width="55" height="55" fill="#B1ADA1" stroke="#8C8279" stroke-width="1"/>
      <rect x="55" y="0" width="55" height="55" fill="#5C8A9B" stroke="#8C8279" stroke-width="1"/>
      <rect x="110" y="0" width="55" height="55" fill="#B1ADA1" stroke="#8C8279" stroke-width="1"/>
      <rect x="165" y="0" width="55" height="55" fill="#7D9B76" stroke="#8C8279" stroke-width="1"/>

      <rect x="0" y="55" width="55" height="55" fill="#5C8A9B" stroke="#8C8279" stroke-width="1"/>
      <rect x="55" y="55" width="55" height="55" fill="#B1ADA1" stroke="#8C8279" stroke-width="1"/>
      <rect x="110" y="55" width="55" height="55" fill="#B1ADA1" stroke="#8C8279" stroke-width="1"/>
      <rect x="165" y="55" width="55" height="55" fill="#5C8A9B" stroke="#8C8279" stroke-width="1"/>

      <rect x="0" y="110" width="55" height="55" fill="#B1ADA1" stroke="#8C8279" stroke-width="1"/>
      <rect x="55" y="110" width="55" height="55" fill="#7D9B76" stroke="#8C8279" stroke-width="1"/>
      <rect x="110" y="110" width="55" height="55" fill="#5C8A9B" stroke="#8C8279" stroke-width="1"/>
      <rect x="165" y="110" width="55" height="55" fill="#B1ADA1" stroke="#8C8279" stroke-width="1"/>

      <rect x="0" y="165" width="55" height="55" fill="#7D9B76" stroke="#8C8279" stroke-width="1"/>
      <rect x="55" y="165" width="55" height="55" fill="#B1ADA1" stroke="#8C8279" stroke-width="1"/>
      <rect x="110" y="165" width="55" height="55" fill="#B1ADA1" stroke="#8C8279" stroke-width="1"/>
      <rect x="165" y="165" width="55" height="55" fill="#5C8A9B" stroke="#8C8279" stroke-width="1"/>

      <!-- 3D depth effect -->
      <polygon points="220,0 250,-18 250,202 220,220" fill="#D5CFC5" stroke="#B1ADA1" stroke-width="1"/>
      <polygon points="0,0 30,-18 250,-18 220,0" fill="#E5E0D8" stroke="#B1ADA1" stroke-width="1"/>
    </g>

    <!-- Legend -->
    <g transform="translate(0, 280)">
      <rect x="0" y="0" width="24" height="24" fill="#B1ADA1" stroke="#8C8279" stroke-width="1"/>
      <text x="35" y="18" font-family="Georgia, serif" font-size="14" fill="#5C534A">= 0 (zero)</text>

      <rect x="130" y="0" width="24" height="24" fill="#5C8A9B" stroke="#8C8279" stroke-width="1"/>
      <text x="165" y="18" font-family="Georgia, serif" font-size="14" fill="#5C8A9B">= +1</text>

      <rect x="220" y="0" width="24" height="24" fill="#7D9B76" stroke="#8C8279" stroke-width="1"/>
      <text x="255" y="18" font-family="Georgia, serif" font-size="14" fill="#7D9B76">= −1</text>
    </g>

    <!-- Goal callout -->
    <g transform="translate(0, 330)">
      <rect x="0" y="0" width="300" height="45" rx="4" fill="#FBF7F4" stroke="#C15F3C" stroke-width="1"/>
      <text x="150" y="28" font-family="Georgia, serif" font-size="15" font-weight="600" fill="#C15F3C" text-anchor="middle">Goal: Make everything zero</text>
    </g>
  </g>

  <!-- CENTER COLUMN: The Game explanation -->
  <g transform="translate(450, 150)">
    <rect x="0" y="0" width="320" height="225" rx="4" fill="#FFFFFF" stroke="#E5E2DC" stroke-width="1"/>

    <text x="160" y="35" font-family="Georgia, serif" font-size="18" font-weight="600" fill="#1A1612" text-anchor="middle">The Game</text>
    <line x1="40" y1="50" x2="280" y2="50" stroke="#E5E2DC" stroke-width="1"/>

    <text x="30" y="80" font-family="Georgia, serif" font-size="14" fill="#5C534A">State:</text>
    <text x="100" y="80" font-family="Georgia, serif" font-size="14" fill="#1A1612">3D tensor of values</text>

    <text x="30" y="110" font-family="Georgia, serif" font-size="14" fill="#5C534A">Action:</text>
    <text x="100" y="110" font-family="Georgia, serif" font-size="14" fill="#1A1612">Select vectors u, v, w</text>

    <text x="30" y="140" font-family="Georgia, serif" font-size="14" fill="#5C534A">Effect:</text>
    <text x="100" y="140" font-family="Georgia, serif" font-size="14" fill="#1A1612">Update tensor entries</text>

    <text x="30" y="170" font-family="Georgia, serif" font-size="14" fill="#5C534A">Win:</text>
    <text x="100" y="170" font-family="Georgia, serif" font-size="14" fill="#1A1612">All entries become zero</text>

    <line x1="40" y1="190" x2="280" y2="190" stroke="#E5E2DC" stroke-width="1"/>
    <text x="160" y="215" font-family="Georgia, serif" font-size="13" fill="#C15F3C" text-anchor="middle" font-style="italic">Each action = one multiplication in final algorithm</text>
  </g>

  <!-- RIGHT COLUMN: Achievement -->
  <g transform="translate(800, 150)">
    <rect x="0" y="0" width="300" height="225" rx="4" fill="#FBF7F4" stroke="#C15F3C" stroke-width="1"/>

    <text x="150" y="35" font-family="Georgia, serif" font-size="18" font-weight="600" fill="#C15F3C" text-anchor="middle">Achievement</text>
    <line x1="40" y1="50" x2="260" y2="50" stroke="#E5E2DC" stroke-width="1"/>

    <text x="150" y="85" font-family="Georgia, serif" font-size="15" fill="#1A1612" text-anchor="middle">First improvement over</text>
    <text x="150" y="110" font-family="Georgia, serif" font-size="15" fill="#1A1612" text-anchor="middle">Strassen's algorithm</text>
    <text x="150" y="135" font-family="Georgia, serif" font-size="20" font-weight="600" fill="#C15F3C" text-anchor="middle">in 50+ years</text>

    <line x1="40" y1="160" x2="260" y2="160" stroke="#E5E2DC" stroke-width="1"/>

    <text x="150" y="190" font-family="Georgia, serif" font-size="14" fill="#8C8279" text-anchor="middle">Strassen 1969 → AlphaTensor 2022</text>
    <text x="150" y="212" font-family="Georgia, serif" font-size="13" fill="#5C534A" text-anchor="middle">for 4×4 matrix multiplication</text>
  </g>

  <!-- BOTTOM: Search Space Scale - now with clear context -->
  <g transform="translate(100, 530)">
    <text x="0" y="0" font-family="Georgia, serif" font-size="16" font-weight="600" fill="#1A1612">Why This Is Hard: The Search Space</text>
    <text x="340" y="0" font-family="Georgia, serif" font-size="14" fill="#8C8279" font-style="italic">— actions available at each step</text>

    <!-- Horizontal bar comparison -->
    <g transform="translate(0, 25)">
      <!-- Chess -->
      <rect x="0" y="0" width="80" height="35" rx="4" fill="#FFFFFF" stroke="#E5E2DC" stroke-width="1"/>
      <text x="40" y="23" font-family="Georgia, serif" font-size="13" fill="#5C534A" text-anchor="middle">Chess</text>
      <rect x="95" y="5" width="35" height="25" rx="3" fill="#E5E2DC"/>
      <text x="112" y="23" font-family="Georgia, serif" font-size="12" fill="#5C534A" text-anchor="middle">~35</text>

      <!-- Go -->
      <rect x="160" y="0" width="80" height="35" rx="4" fill="#FFFFFF" stroke="#E5E2DC" stroke-width="1"/>
      <text x="200" y="23" font-family="Georgia, serif" font-size="13" fill="#5C534A" text-anchor="middle">Go</text>
      <rect x="255" y="5" width="50" height="25" rx="3" fill="#E5E2DC"/>
      <text x="280" y="23" font-family="Georgia, serif" font-size="12" fill="#5C534A" text-anchor="middle">~250</text>

      <!-- AlphaTensor -->
      <rect x="340" y="0" width="120" height="35" rx="4" fill="#FBF7F4" stroke="#C15F3C" stroke-width="1"/>
      <text x="400" y="23" font-family="Georgia, serif" font-size="13" font-weight="600" fill="#C15F3C" text-anchor="middle">AlphaTensor</text>
      <rect x="475" y="0" width="180" height="35" rx="3" fill="#C15F3C"/>
      <text x="565" y="23" font-family="Georgia, serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">10³³⁺ possibilities</text>
    </g>

    <!-- Explanation -->
    <text x="0" y="90" font-family="Georgia, serif" font-size="13" fill="#5C534A">More possibilities at each step than atoms in the observable universe.</text>
    <text x="0" y="110" font-family="Georgia, serif" font-size="13" fill="#5C534A">Yet AlphaTensor found solutions that humans couldn't in 50 years.</text>
  </g>

  <!-- Connection to your work -->
  <g transform="translate(100, 680)">
    <rect x="0" y="0" width="1000" height="55" rx="4" fill="#FFFFFF" stroke="#E5E2DC" stroke-width="1"/>
    <text x="500" y="22" font-family="Georgia, serif" font-size="14" fill="#5C534A" text-anchor="middle">
      <tspan font-weight="600" fill="#C15F3C">AlphaTensor</tspan> discovers new algorithms.
      <tspan font-weight="600" fill="#C15F3C">AlphaEvolve</tspan> optimizes existing ones.
    </text>
    <text x="500" y="44" font-family="Georgia, serif" font-size="14" fill="#5C534A" text-anchor="middle">
      We applied the same principle to GPU kernel configuration search.
    </text>
  </g>

  <!-- Footer -->
  <text x="600" y="770" font-family="Georgia, serif" font-size="12" fill="#8C8279" text-anchor="middle" font-style="italic">Source: DeepMind, "Discovering novel algorithms with AlphaTensor", Nature 2022</text>
</svg>