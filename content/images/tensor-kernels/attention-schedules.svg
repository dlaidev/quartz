<svg xmlns="http://www.w3.org/2000/svg" width="480" height="930" viewBox="0 0 480 930" role="img" aria-labelledby="title desc">
  <title id="title">Materialized and streamed attention</title>
  <desc id="desc">Materialized attention forms the full query by key score matrix, then masks, normalizes and multiplies by values. Streamed attention handles a query tile and one key-value chunk at a time. Each score block is masked before the online maximum, normalizer and weighted-output state is updated. After all key-value chunks the result is o divided by l. Shapes are conceptual, not hardware-sized.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#242424" stroke-width="1.25"/></marker></defs>
  <style>text{font-family:Arial,Helvetica,sans-serif;fill:#171717;font-size:20px} .small{font-size:18px;fill:#555} .label{font-size:16px;letter-spacing:1.3px} .line{fill:none;stroke:#242424;stroke-width:1.3} .rule{stroke:#b5b5b5;stroke-width:1} .box{fill:#fff;stroke:#242424;stroke-width:1.3}</style>
  <rect width="480" height="930" fill="#fff"/>
  <text x="28" y="30" class="label">A / MATERIALIZE</text>
  <text x="240" y="68" text-anchor="middle">All key positions x</text>
  <rect x="143" y="90" width="240" height="192" fill="#f0f0f0" stroke="#242424" stroke-width="1.3"/>
  <path d="M203 90 V282 M263 90 V282 M323 90 V282 M143 138 H383 M143 186 H383 M143 234 H383" class="rule"/>
  <text x="95" y="171" text-anchor="middle">All</text>
  <text x="95" y="198" text-anchor="middle">queries</text>
  <text x="95" y="225" text-anchor="middle">q</text>
  <text x="263" y="313" text-anchor="middle">Full score matrix S = QKᵀ</text>
  <path d="M263 329 L263 356" class="line" marker-end="url(#arrow)"/>
  <text x="240" y="386" text-anchor="middle">mask → softmax → multiply V</text>
  <text x="240" y="418" text-anchor="middle" class="small">Intermediate storage grows with q × x.</text>
  <line x1="28" y1="455" x2="452" y2="455" class="rule"/>
  <text x="28" y="494" class="label">B / STREAM</text>
  <text x="240" y="532" text-anchor="middle">Key/value chunks x</text>
  <rect x="143" y="552" width="240" height="56" fill="#fff" stroke="#242424" stroke-width="1.3"/>
  <rect x="203" y="552" width="60" height="56" fill="#dedede"/>
  <path d="M203 552 V608 M263 552 V608 M323 552 V608" class="rule"/>
  <text x="93" y="575" text-anchor="middle">One</text>
  <text x="93" y="600" text-anchor="middle">q tile</text>
  <path d="M233 608 L233 644" class="line" marker-end="url(#arrow)"/>
  <text x="240" y="675" text-anchor="middle">score block → mask</text>
  <path d="M240 690 L240 719" class="line" marker-end="url(#arrow)"/>
  <rect x="121" y="730" width="238" height="74" fill="#f0f0f0" stroke="#242424" stroke-width="1.3"/>
  <text x="240" y="760" text-anchor="middle">update state m, l, o</text>
  <text x="240" y="789" text-anchor="middle" class="small">include this chunk’s V</text>
  <path d="M359 767 H410 V580 H397" class="line" marker-end="url(#arrow)"/>
  <text x="439" y="683" transform="rotate(-90 439 683)" text-anchor="middle" class="small">next chunk</text>
  <path d="M240 804 L240 832" class="line" marker-end="url(#arrow)"/>
  <text x="240" y="863" text-anchor="middle">After all chunks: O = o / l</text>
  <line x1="28" y1="887" x2="452" y2="887" class="rule"/>
  <text x="240" y="917" text-anchor="middle" class="small">Conceptual shapes; not hardware scale.</text>
</svg>
