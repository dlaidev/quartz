<svg xmlns="http://www.w3.org/2000/svg" width="480" height="620" viewBox="0 0 480 620" role="img" aria-labelledby="title desc">
  <title id="title">Attention as an operation plus access maps</title>
  <desc id="desc">For each broadcast coordinate q,x, select Q[q,:] and K[x,:], take their dot product over the target axis d, and write S[q,x]. Q is reused across x; K is reused across q. Head and batch axes are omitted.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#242424" stroke-width="1.25"/></marker></defs>
  <style>text{font-family:Arial,Helvetica,sans-serif;fill:#171717;font-size:20px} .small{font-size:18px;fill:#555} .label{font-size:16px;letter-spacing:1.3px} .line{fill:none;stroke:#242424;stroke-width:1.3} .rule{stroke:#b5b5b5;stroke-width:1} .box{fill:#fff;stroke:#242424;stroke-width:1.3}</style>
  <rect width="480" height="620" fill="#fff"/>
  <text x="240" y="30" text-anchor="middle" class="label">BROADCAST COORDINATES</text>
  <rect x="164" y="49" width="152" height="56" class="box"/>
  <text x="240" y="84" text-anchor="middle" font-size="25">(q, x)</text>
  <path d="M205 105 L205 130 L112 130 L112 135" class="line"/>
  <path d="M275 105 L275 130 L368 130 L368 135" class="line"/>
  <path d="M112 169 L112 175" class="line" marker-end="url(#arrow)"/>
  <path d="M368 169 L368 175" class="line" marker-end="url(#arrow)"/>
  <text x="112" y="160" text-anchor="middle" class="small">keep q</text>
  <text x="368" y="160" text-anchor="middle" class="small">keep x</text>
  <rect x="28" y="184" width="168" height="68" class="box"/>
  <rect x="284" y="184" width="168" height="68" class="box"/>
  <text x="112" y="225" text-anchor="middle" font-size="24">Q[q, :]</text>
  <text x="368" y="225" text-anchor="middle" font-size="24">K[x, :]</text>
  <text x="112" y="280" text-anchor="middle" class="small">reused across x</text>
  <text x="368" y="280" text-anchor="middle" class="small">reused across q</text>
  <path d="M112 301 L112 328 L206 328 L206 357" class="line" marker-end="url(#arrow)"/>
  <path d="M368 301 L368 328 L274 328 L274 357" class="line" marker-end="url(#arrow)"/>
  <rect x="108" y="368" width="264" height="78" fill="#f0f0f0" stroke="#242424" stroke-width="1.3"/>
  <text x="240" y="399" text-anchor="middle">scaled dot product</text>
  <text x="240" y="427" text-anchor="middle" class="small">reduce target axis d</text>
  <path d="M240 446 L240 484" class="line" marker-end="url(#arrow)"/>
  <rect x="154" y="495" width="172" height="56" class="box"/>
  <text x="240" y="531" text-anchor="middle" font-size="25">S[q, x]</text>
  <line x1="28" y1="577" x2="452" y2="577" class="rule"/>
  <text x="240" y="606" text-anchor="middle" class="small">Batch and head axes omitted.</text>
</svg>
