<svg xmlns="http://www.w3.org/2000/svg" width="480" height="865" viewBox="0 0 480 865" role="img" aria-labelledby="title desc">
  <title id="title">Proposed pyncd and EggEvolve integration</title>
  <desc id="desc">A pyncd model is exported to MathIR. Trusted conditional rewrites build an e-graph of equivalent algorithms, for example materialized and streamed attention. A selector picks feasible candidates for lowering and correctness testing, then benchmarks passing candidates. Measured performance feeds back to candidate selection. Dashed boxes mark work still needed.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#242424" stroke-width="1.25"/></marker></defs>
  <style>text{font-family:Arial,Helvetica,sans-serif;fill:#171717;font-size:20px} .small{font-size:18px;fill:#555} .label{font-size:16px;letter-spacing:1.3px} .line{fill:none;stroke:#242424;stroke-width:1.3} .rule{stroke:#b5b5b5;stroke-width:1} .box{fill:#fff;stroke:#242424;stroke-width:1.3} .proposed{fill:#fff;stroke:#242424;stroke-width:1.3;stroke-dasharray:5 4}</style>
  <rect width="480" height="865" fill="#fff"/>
  <text x="240" y="29" text-anchor="middle" class="label">PROPOSED INTEGRATION</text>
  <rect x="95" y="51" width="290" height="59" class="box"/>
  <text x="240" y="88" text-anchor="middle">pyncd model</text>
  <path d="M240 110 V146" class="line" marker-end="url(#arrow)"/>
  <rect x="95" y="156" width="290" height="59" class="proposed"/>
  <text x="240" y="193" text-anchor="middle">MathIR export</text>
  <path d="M240 215 V250" class="line" marker-end="url(#arrow)"/>
  <rect x="48" y="260" width="384" height="88" fill="#f0f0f0" stroke="#242424" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="240" y="294" text-anchor="middle">Trusted conditional rewrites</text>
  <text x="240" y="326" text-anchor="middle" class="small">e-graph of equivalent algorithms</text>
  <path d="M160 348 V379 H126 V407" class="line" marker-end="url(#arrow)"/>
  <path d="M320 348 V379 H354 V407" class="line" marker-end="url(#arrow)"/>
  <rect x="34" y="417" width="184" height="60" class="proposed"/>
  <rect x="262" y="417" width="184" height="60" class="proposed"/>
  <text x="126" y="454" text-anchor="middle">Materialized</text>
  <text x="354" y="454" text-anchor="middle">Streamed</text>
  <path d="M126 477 V507 H210 V534" class="line" marker-end="url(#arrow)"/>
  <path d="M354 477 V507 H270 V534" class="line" marker-end="url(#arrow)"/>
  <rect x="76" y="544" width="328" height="64" class="proposed"/>
  <text x="240" y="584" text-anchor="middle">Select feasible candidates</text>
  <path d="M240 608 V641" class="line" marker-end="url(#arrow)"/>
  <rect x="95" y="651" width="290" height="64" class="proposed"/>
  <text x="240" y="691" text-anchor="middle">Lower + correctness test</text>
  <path d="M240 715 V748" class="line" marker-end="url(#arrow)"/>
  <rect x="95" y="758" width="290" height="58" class="proposed"/>
  <text x="240" y="794" text-anchor="middle">Benchmark passing code</text>
  <path d="M385 786 H459 V576 H416" class="line" marker-end="url(#arrow)"/>
  <text x="447" y="685" transform="rotate(-90 447 685)" text-anchor="middle" class="small">measured cost</text>
  <text x="240" y="850" text-anchor="middle" class="small">Dashed boxes: integration work still needed.</text>
</svg>
