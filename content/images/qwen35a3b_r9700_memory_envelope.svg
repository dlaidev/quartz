<text x="70" y="70" class="title">Per-GPU memory envelope at launch</text><text x="70" y="102" class="subtitle">Budgeting at 90% utilization gives enough room to breathe. Pushing higher is how you get stupid failures.</text><rect x="60" y="140" width="980" height="420" rx="18" fill="white" stroke="#e7dccb"/><rect x="120" y="260" width="502.7014958696138" height="68" rx="14" fill="#8b5e3c"/><text x="371.3507479348069" y="300" text-anchor="middle" class="mono">17.32 GiB</text><rect x="622.7014958696138" y="260" width="192.14110292476" height="68" rx="14" fill="#c08a4d"/><text x="718.7720473319938" y="300" text-anchor="middle" class="mono">6.62 GiB</text><rect x="814.8425987943738" y="260" width="85.15740120562621" height="68" rx="14" fill="#b76e79"/><text x="857.4212993971869" y="300" text-anchor="middle" class="mono">2.93 GiB</text><line x1="120.0" y1="230" x2="120.0" y2="350" stroke="#e7dccb" stroke-width="1"/><text x="120.0" y="374" text-anchor="middle" class="small">0</text><line x1="207.073007367716" y1="230" x2="207.073007367716" y2="350" stroke="#e7dccb" stroke-width="1"/><text x="207.073007367716" y="374" text-anchor="middle" class="small">3</text><line x1="294.146014735432" y1="230" x2="294.146014735432" y2="350" stroke="#e7dccb" stroke-width="1"/><text x="294.146014735432" y="374" text-anchor="middle" class="small">6</text><line x1="381.219022103148" y1="230" x2="381.219022103148" y2="350" stroke="#e7dccb" stroke-width="1"/><text x="381.219022103148" y="374" text-anchor="middle" class="small">9</text><line x1="468.292029470864" y1="230" x2="468.292029470864" y2="350" stroke="#e7dccb" stroke-width="1"/><text x="468.292029470864" y="374" text-anchor="middle" class="small">12</text><line x1="555.3650368385801" y1="230" x2="555.3650368385801" y2="350" stroke="#e7dccb" stroke-width="1"/><text x="555.3650368385801" y="374" text-anchor="middle" class="small">15</text><line x1="642.438044206296" y1="230" x2="642.438044206296" y2="350" stroke="#e7dccb" stroke-width="1"/><text x="642.438044206296" y="374" text-anchor="middle" class="small">18</text><line x1="729.5110515740121" y1="230" x2="729.5110515740121" y2="350" stroke="#e7dccb" stroke-width="1"/><text x="729.5110515740121" y="374" text-anchor="middle" class="small">21</text><line x1="816.584058941728" y1="230" x2="816.584058941728" y2="350" stroke="#e7dccb" stroke-width="1"/><text x="816.584058941728" y="374" text-anchor="middle" class="small">24</text><line x1="903.6570663094441" y1="230" x2="903.6570663094441" y2="350" stroke="#e7dccb" stroke-width="1"/><text x="903.6570663094441" y="374" text-anchor="middle" class="small">27</text><text x="120" y="225" class="axis">Usable budget per GPU (GiB)</text><text x="120" y="440" class="value">Budget: 26.87 GiB out of 29.86 GiB physical</text><text x="120" y="470" class="small">vLLM reported 173,184 GPU KV-cache tokens and 5.13× max concurrency at 131k tokens/request.</text><rect x="120" y="489" width="22" height="22" rx="6" fill="#8b5e3c"/><text x="155" y="505" class="label">Weights + runtime state</text><text x="500" y="505" class="small">17.32 GiB</text><rect x="120" y="525" width="22" height="22" rx="6" fill="#c08a4d"/><text x="155" y="541" class="label">KV cache available after load</text><text x="500" y="541" class="small">6.62 GiB</text><rect x="120" y="561" width="22" height="22" rx="6" fill="#b76e79"/><text x="155" y="577" class="label">Slack / allocator headroom</text><text x="500" y="577" class="small">2.93 GiB</text><rect x="735" y="415" width="255" height="110" rx="18" fill="#f1e7d8" stroke="#e7dccb"/><text x="760" y="447" class="small">Rule of thumb</text><text x="760" y="477" class="value">Stay conservative</text><text x="760" y="505" class="small">0.90 utilization left enough slack for a clean bring-up.</text>
