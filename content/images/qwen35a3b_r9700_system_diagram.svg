<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b5e3c"/></marker></defs><text x="70" y="70" class="title">Serving topology on shark</text><text x="70" y="102" class="subtitle">What actually came up during the successful dual-GPU run.</text><rect x="90" y="180" width="180" height="92" rx="18" fill="white" stroke="#e7dccb" stroke-width="2"/><text x="108" y="216" class="label">Client / benchmark driver</text><text x="108" y="242" class="small">HTTP requests from local controller</text><rect x="335" y="180" width="210" height="92" rx="18" fill="white" stroke="#e7dccb" stroke-width="2"/><text x="353" y="216" class="label">vLLM API server</text><text x="353" y="242" class="small">OpenAI-compatible endpoint on :8000</text><rect x="620" y="120" width="180" height="92" rx="18" fill="white" stroke="#e7dccb" stroke-width="2"/><text x="638" y="156" class="label">GPU 0 / TP rank 0</text><text x="638" y="182" class="small">R9700 · prompt/decode shard</text><rect x="620" y="265" width="180" height="92" rx="18" fill="white" stroke="#e7dccb" stroke-width="2"/><text x="638" y="301" class="label">GPU 1 / TP rank 1</text><text x="638" y="327" class="small">R9700 · prompt/decode shard</text><rect x="860" y="193" width="170" height="92" rx="18" fill="white" stroke="#e7dccb" stroke-width="2"/><text x="878" y="229" class="label">CPU offload</text><text x="878" y="255" class="small">20 GiB host-side spillover</text><line x1="270" y1="226" x2="335" y2="226" stroke="#8b5e3c" stroke-width="4" marker-end="url(#arrow)"/><text x="302.5" y="216.0" text-anchor="middle" class="small">HTTP /v1/chat/completions</text><line x1="545" y1="226" x2="620" y2="166" stroke="#8b5e3c" stroke-width="4" marker-end="url(#arrow)"/><text x="582.5" y="186.0" text-anchor="middle" class="small">tensor parallel shard</text><line x1="545" y1="226" x2="620" y2="311" stroke="#8b5e3c" stroke-width="4" marker-end="url(#arrow)"/><text x="582.5" y="258.5" text-anchor="middle" class="small">tensor parallel shard</text><line x1="800" y1="166" x2="860" y2="239" stroke="#8b5e3c" stroke-width="4" marker-end="url(#arrow)"/><text x="830.0" y="192.5" text-anchor="middle" class="small">offload + host memory</text><line x1="800" y1="311" x2="860" y2="239" stroke="#8b5e3c" stroke-width="4" marker-end="url(#arrow)"/><rect x="90" y="420" width="940" height="150" rx="18" fill="white" stroke="#e7dccb"/><text x="120" y="458" class="label">Key launch knobs</text><text x="120" y="492" class="mono">tensor_parallel_size=2 · cpu_offload_gb=20 · gpu_memory_utilization=0.90</text><text x="120" y="526" class="mono">max_model_len=131072 · enforce_eager=true · safetensors_load_strategy=eager</text><text x="120" y="558" class="mono">FLASH_ATTENTION_TRITON_AMD_ENABLE=TRUE · VLLM_WORKER_MULTIPROC_METHOD=spawn</text>
