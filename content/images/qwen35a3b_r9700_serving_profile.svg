<text x="70" y="70" class="title">Dual-R9700 serving profile</text><text x="70" y="102" class="subtitle">Warm throughput is decent. Stability is the problem.</text><rect x="60" y="130" width="470" height="430" rx="18" fill="white" stroke="#e7dccb"/><text x="90" y="168" class="label">Throughput</text><text x="90" y="192" class="small">Prompt range from historical stable runs; decode from measured post-warm request</text><line x1="90.0" y1="220" x2="90.0" y2="330" stroke="#e7dccb" stroke-width="1"/><text x="90.0" y="350" text-anchor="middle" class="small">0</text><line x1="166.0" y1="220" x2="166.0" y2="330" stroke="#e7dccb" stroke-width="1"/><text x="166.0" y="350" text-anchor="middle" class="small">1100</text><line x1="242.0" y1="220" x2="242.0" y2="330" stroke="#e7dccb" stroke-width="1"/><text x="242.0" y="350" text-anchor="middle" class="small">2200</text><line x1="318.0" y1="220" x2="318.0" y2="330" stroke="#e7dccb" stroke-width="1"/><text x="318.0" y="350" text-anchor="middle" class="small">3300</text><line x1="394.0" y1="220" x2="394.0" y2="330" stroke="#e7dccb" stroke-width="1"/><text x="394.0" y="350" text-anchor="middle" class="small">4400</text><line x1="470.0" y1="220" x2="470.0" y2="330" stroke="#e7dccb" stroke-width="1"/><text x="470.0" y="350" text-anchor="middle" class="small">5500</text><text x="90" y="225" class="axis">Prompt tok/s</text><rect x="90" y="245" width="380" height="22" rx="11" fill="#f1e7d8"/><rect x="378.5927272727273" y="245" width="60.03309090909088" height="22" rx="11" fill="#c08a4d" opacity="0.75"/><line x1="408.6092727272727" y1="238" x2="408.6092727272727" y2="274" stroke="#3b2f2f" stroke-width="3"/><text x="90" y="300" class="small">Observed range: 4177–5046 tok/s</text><text x="90" y="322" class="value">Midpoint 4611 tok/s</text><line x1="90.0" y1="405" x2="90.0" y2="515" stroke="#e7dccb" stroke-width="1"/><text x="90.0" y="535" text-anchor="middle" class="small">0</text><line x1="153.33333333333334" y1="405" x2="153.33333333333334" y2="515" stroke="#e7dccb" stroke-width="1"/><text x="153.33333333333334" y="535" text-anchor="middle" class="small">5</text><line x1="216.66666666666669" y1="405" x2="216.66666666666669" y2="515" stroke="#e7dccb" stroke-width="1"/><text x="216.66666666666669" y="535" text-anchor="middle" class="small">10</text><line x1="280.0" y1="405" x2="280.0" y2="515" stroke="#e7dccb" stroke-width="1"/><text x="280.0" y="535" text-anchor="middle" class="small">15</text><line x1="343.33333333333337" y1="405" x2="343.33333333333337" y2="515" stroke="#e7dccb" stroke-width="1"/><text x="343.33333333333337" y="535" text-anchor="middle" class="small">20</text><line x1="406.6666666666667" y1="405" x2="406.6666666666667" y2="515" stroke="#e7dccb" stroke-width="1"/><text x="406.6666666666667" y="535" text-anchor="middle" class="small">25</text><line x1="470.0" y1="405" x2="470.0" y2="515" stroke="#e7dccb" stroke-width="1"/><text x="470.0" y="535" text-anchor="middle" class="small">30</text><rect x="560" y="130" width="470" height="430" rx="18" fill="white" stroke="#e7dccb"/><text x="590" y="168" class="label">Latency snapshot</text><text x="590" y="192" class="small">Single successful 1,036-token prompt → 128-token completion</text><text x="90" y="410" class="axis">Decode tok/s</text><rect x="90" y="430" width="380" height="22" rx="11" fill="#f1e7d8"/><rect x="90" y="430" width="289.17999999999995" height="22" rx="11" fill="#8b5e3c"/><text x="90" y="485" class="value">22.83 tok/s</text><text x="90" y="508" class="small">Warm decode is respectable for a 35B-class MoE on prosumer AMD.</text><rect x="590" y="230" width="180" height="74" rx="14" fill="#f1e7d8" stroke="#e7dccb"/><text x="608" y="258" class="small">TTFT</text><text x="608" y="284" class="value">0.422 s</text><rect x="800" y="230" width="180" height="74" rx="14" fill="#f1e7d8" stroke="#e7dccb"/><text x="818" y="258" class="small">Total latency</text><text x="818" y="284" class="value">6.03 s</text><rect x="590" y="325" width="180" height="74" rx="14" fill="#f1e7d8" stroke="#e7dccb"/><text x="608" y="353" class="small">Completion size</text><text x="608" y="379" class="value">128 tok</text><rect x="800" y="325" width="180" height="74" rx="14" fill="#f1e7d8" stroke="#e7dccb"/><text x="818" y="353" class="small">Prompt size</text><text x="818" y="379" class="value">1036 tok</text><rect x="60" y="580" width="970" height="46" rx="14" fill="white" stroke="#e7dccb"/><text x="85" y="610" class="mono">Takeaway: healthy runs hit good throughput; the bad news starts when you ask the stack to stay healthy.</text>
