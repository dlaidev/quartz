<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <marker id="arrowhead2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#C15F3C"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="#F4F3EE"/>

  <!-- Title -->
  <text x="600" y="50" font-family="Georgia, serif" font-size="32" font-weight="bold" fill="#C15F3C" text-anchor="middle">Traditional Approaches to Kernel Optimization</text>
  <text x="600" y="85" font-family="Georgia, serif" font-size="18" fill="#5a4a3a" text-anchor="middle">Both have significant drawbacks that slow down research velocity</text>

  <!-- Left Side: Search-Based Autotuning -->
  <rect x="50" y="110" width="520" height="340" fill="#fff" stroke="#C15F3C" stroke-width="2" rx="10"/>
  <rect x="50" y="110" width="520" height="50" fill="#C15F3C" rx="10"/>
  <rect x="50" y="140" width="520" height="20" fill="#C15F3C"/>
  <text x="310" y="145" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">Approach 1: Search-Based Autotuning</text>

  <!-- Autotuning Flow -->
  <g transform="translate(80, 180)">
    <!-- Input Shape -->
    <rect x="0" y="0" width="100" height="50" fill="#e8e4dc" stroke="#C15F3C" stroke-width="1" rx="5"/>
    <text x="50" y="30" font-family="Georgia, serif" font-size="12" fill="#5a4a3a" text-anchor="middle">Input Shape</text>
    <text x="50" y="45" font-family="Georgia, serif" font-size="10" fill="#C15F3C" text-anchor="middle">[4096, 2048]</text>

    <!-- Arrow -->
    <line x1="105" y1="25" x2="135" y2="25" stroke="#C15F3C" stroke-width="2" marker-end="url(#arrowhead2)"/>

    <!-- Search Space -->
    <rect x="140" y="0" width="100" height="50" fill="#e8e4dc" stroke="#C15F3C" stroke-width="1" rx="5"/>
    <text x="190" y="25" font-family="Georgia, serif" font-size="12" fill="#5a4a3a" text-anchor="middle">Search Space</text>
    <text x="190" y="40" font-family="Georgia, serif" font-size="10" fill="#C15F3C" text-anchor="middle">1000s configs</text>

    <!-- Arrow -->
    <line x1="245" y1="25" x2="275" y2="25" stroke="#C15F3C" stroke-width="2" marker-end="url(#arrowhead2)"/>

    <!-- Benchmark -->
    <rect x="280" y="0" width="100" height="50" fill="#e8e4dc" stroke="#C15F3C" stroke-width="1" rx="5"/>
    <text x="330" y="25" font-family="Georgia, serif" font-size="12" fill="#5a4a3a" text-anchor="middle">Benchmark</text>
    <text x="330" y="40" font-family="Georgia, serif" font-size="10" fill="#C15F3C" text-anchor="middle">Each config</text>

    <!-- Arrow -->
    <line x1="385" y1="25" x2="415" y2="25" stroke="#C15F3C" stroke-width="2" marker-end="url(#arrowhead2)"/>

    <!-- Best Config -->
    <rect x="420" y="0" width="60" height="50" fill="#d4c4b0" stroke="#C15F3C" stroke-width="2" rx="5"/>
    <text x="450" y="30" font-family="Georgia, serif" font-size="10" fill="#5a4a3a" text-anchor="middle">Best</text>
  </g>

  <!-- Repeat indicator -->
  <g transform="translate(80, 250)">
    <rect x="0" y="0" width="460" height="40" fill="#fef0e8" stroke="#C15F3C" stroke-width="1" stroke-dasharray="5,3" rx="5"/>
    <text x="230" y="25" font-family="Georgia, serif" font-size="14" fill="#8a2a0a" text-anchor="middle">⟳ Repeat for EVERY new input shape!</text>
  </g>

  <!-- Problems list -->
  <g transform="translate(80, 310)">
    <text x="0" y="0" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#8a2a0a">Problems:</text>
    <text x="0" y="25" font-family="Georgia, serif" font-size="13" fill="#5a4a3a">✗ Interrupts research workflow every time</text>
    <text x="0" y="45" font-family="Georgia, serif" font-size="13" fill="#5a4a3a">✗ Hours of TPU time per shape</text>
    <text x="0" y="65" font-family="Georgia, serif" font-size="13" fill="#5a4a3a">✗ Cannot generalize to unseen shapes</text>
    <text x="0" y="85" font-family="Georgia, serif" font-size="13" fill="#5a4a3a">✗ Must re-tune after any model change</text>
  </g>

  <!-- Right Side: Manual Heuristics -->
  <rect x="630" y="110" width="520" height="340" fill="#fff" stroke="#C15F3C" stroke-width="2" rx="10"/>
  <rect x="630" y="110" width="520" height="50" fill="#C15F3C" rx="10"/>
  <rect x="630" y="140" width="520" height="20" fill="#C15F3C"/>
  <text x="890" y="145" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">Approach 2: Manual Heuristics</text>

  <!-- Expert brain with code -->
  <g transform="translate(660, 175)">
    <ellipse cx="60" cy="40" rx="50" ry="35" fill="#e8e4dc" stroke="#C15F3C" stroke-width="2"/>
    <text x="60" y="35" font-family="Georgia, serif" font-size="14" fill="#5a4a3a" text-anchor="middle">Expert</text>
    <text x="60" y="50" font-family="Georgia, serif" font-size="12" fill="#5a4a3a" text-anchor="middle">Engineer</text>

    <!-- Arrow -->
    <line x1="115" y1="40" x2="145" y2="40" stroke="#C15F3C" stroke-width="2" marker-end="url(#arrowhead2)"/>

    <!-- Code block -->
    <rect x="150" y="5" width="200" height="70" fill="#2d2d2d" stroke="#C15F3C" stroke-width="1" rx="5"/>
    <text x="160" y="25" font-family="monospace" font-size="10" fill="#98c379">def get_tile_size(M, N, K):</text>
    <text x="160" y="40" font-family="monospace" font-size="10" fill="#e5c07b">  if M &gt; 4096:</text>
    <text x="160" y="55" font-family="monospace" font-size="10" fill="#61afef">    return (128, 128, 64)</text>
    <text x="160" y="70" font-family="monospace" font-size="10" fill="#c678dd">  # ... 100s of rules</text>

    <!-- Arrow -->
    <line x1="355" y1="40" x2="385" y2="40" stroke="#C15F3C" stroke-width="2" marker-end="url(#arrowhead2)"/>

    <!-- Works for all shapes -->
    <rect x="390" y="10" width="70" height="60" fill="#d4c4b0" stroke="#C15F3C" stroke-width="2" rx="5"/>
    <text x="425" y="35" font-family="Georgia, serif" font-size="10" fill="#5a4a3a" text-anchor="middle">Works for</text>
    <text x="425" y="50" font-family="Georgia, serif" font-size="10" fill="#5a4a3a" text-anchor="middle">all shapes</text>
  </g>

  <!-- Requirements -->
  <g transform="translate(660, 265)">
    <rect x="0" y="0" width="460" height="55" fill="#fef0e8" stroke="#C15F3C" stroke-width="1" stroke-dasharray="5,3" rx="5"/>
    <text x="230" y="20" font-family="Georgia, serif" font-size="13" fill="#5a4a3a" text-anchor="middle">Requires deep understanding of:</text>
    <text x="230" y="40" font-family="Georgia, serif" font-size="12" fill="#8a2a0a" text-anchor="middle">TPU architecture + Memory hierarchy + Kernel semantics</text>
  </g>

  <!-- Problems list -->
  <g transform="translate(660, 335)">
    <text x="0" y="0" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#8a2a0a">Problems:</text>
    <text x="0" y="25" font-family="Georgia, serif" font-size="13" fill="#5a4a3a">✗ Months of expert engineering time</text>
    <text x="0" y="45" font-family="Georgia, serif" font-size="13" fill="#5a4a3a">✗ Rare expertise (few people in the world)</text>
    <text x="0" y="65" font-family="Georgia, serif" font-size="13" fill="#5a4a3a">✗ Must re-engineer for new hardware</text>
    <text x="0" y="85" font-family="Georgia, serif" font-size="13" fill="#5a4a3a">✗ Suboptimal: human intuition has limits</text>
  </g>

  <!-- Bottom: The Ideal Solution -->
  <rect x="200" y="480" width="800" height="290" fill="#d4c4b0" stroke="#C15F3C" stroke-width="3" rx="15"/>
  <text x="600" y="520" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#C15F3C" text-anchor="middle">The Ideal Solution: Best of Both Worlds</text>

  <!-- Three pillars -->
  <g transform="translate(260, 550)">
    <rect x="0" y="0" width="200" height="80" fill="#fff" stroke="#C15F3C" stroke-width="2" rx="8"/>
    <text x="100" y="30" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#C15F3C" text-anchor="middle">Generalizable</text>
    <text x="100" y="50" font-family="Georgia, serif" font-size="13" fill="#5a4a3a" text-anchor="middle">Works for any input</text>
    <text x="100" y="70" font-family="Georgia, serif" font-size="13" fill="#5a4a3a" text-anchor="middle">shape (like heuristics)</text>
  </g>

  <g transform="translate(500, 550)">
    <rect x="0" y="0" width="200" height="80" fill="#fff" stroke="#C15F3C" stroke-width="2" rx="8"/>
    <text x="100" y="30" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#C15F3C" text-anchor="middle">Optimal</text>
    <text x="100" y="50" font-family="Georgia, serif" font-size="13" fill="#5a4a3a" text-anchor="middle">Performance close to</text>
    <text x="100" y="70" font-family="Georgia, serif" font-size="13" fill="#5a4a3a" text-anchor="middle">autotuning (or better)</text>
  </g>

  <g transform="translate(740, 550)">
    <rect x="0" y="0" width="200" height="80" fill="#fff" stroke="#C15F3C" stroke-width="2" rx="8"/>
    <text x="100" y="30" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#C15F3C" text-anchor="middle">Automated</text>
    <text x="100" y="50" font-family="Georgia, serif" font-size="13" fill="#5a4a3a" text-anchor="middle">No expert months</text>
    <text x="100" y="70" font-family="Georgia, serif" font-size="13" fill="#5a4a3a" text-anchor="middle">needed (days, not months)</text>
  </g>

  <!-- Arrow pointing to AlphaEvolve -->
  <text x="600" y="680" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#C15F3C" text-anchor="middle">↓ AlphaEvolve ↓</text>
  <text x="600" y="720" font-family="Georgia, serif" font-size="18" fill="#5a4a3a" text-anchor="middle">Use LLMs to evolve optimal heuristics automatically</text>
  <text x="600" y="750" font-family="Georgia, serif" font-size="16" fill="#5a4a3a" text-anchor="middle">Generate code that works for all shapes, with performance matching autotuning</text>
</svg>