<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#C15F3C"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="#F4F3EE"/>

  <!-- Title -->
  <text x="600" y="50" font-family="Georgia, serif" font-size="32" font-weight="bold" fill="#C15F3C" text-anchor="middle">The Matrix Tiling Problem</text>
  <text x="600" y="85" font-family="Georgia, serif" font-size="18" fill="#5a4a3a" text-anchor="middle">Why tile size selection is critical for TPU performance</text>

  <!-- Left side: Large Matrix Multiplication -->
  <text x="200" y="130" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5a4a3a" text-anchor="middle">Large Matrix Multiplication</text>

  <!-- Matrix A -->
  <rect x="50" y="160" width="120" height="180" fill="#e8e4dc" stroke="#C15F3C" stroke-width="2"/>
  <text x="110" y="255" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#C15F3C" text-anchor="middle">A</text>
  <text x="110" y="280" font-family="Georgia, serif" font-size="12" fill="#5a4a3a" text-anchor="middle">(M × K)</text>

  <!-- Multiplication symbol -->
  <text x="190" y="260" font-family="Georgia, serif" font-size="32" fill="#C15F3C" text-anchor="middle">×</text>

  <!-- Matrix B -->
  <rect x="210" y="160" width="180" height="120" fill="#e8e4dc" stroke="#C15F3C" stroke-width="2"/>
  <text x="300" y="225" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#C15F3C" text-anchor="middle">B</text>
  <text x="300" y="250" font-family="Georgia, serif" font-size="12" fill="#5a4a3a" text-anchor="middle">(K × N)</text>

  <!-- Equals -->
  <text x="110" y="380" font-family="Georgia, serif" font-size="32" fill="#C15F3C" text-anchor="middle">=</text>

  <!-- Result Matrix C -->
  <rect x="150" y="350" width="180" height="180" fill="#d4c4b0" stroke="#C15F3C" stroke-width="3"/>
  <text x="240" y="445" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#C15F3C" text-anchor="middle">C</text>
  <text x="240" y="470" font-family="Georgia, serif" font-size="12" fill="#5a4a3a" text-anchor="middle">(M × N)</text>

  <!-- Arrow to tiled version -->
  <line x1="400" y1="300" x2="480" y2="300" stroke="#C15F3C" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="440" y="280" font-family="Georgia, serif" font-size="14" fill="#C15F3C" text-anchor="middle">Tile it!</text>

  <!-- Right side: Tiled Matrix -->
  <text x="750" y="130" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5a4a3a" text-anchor="middle">Tiled Computation</text>

  <!-- Tiled Matrix A -->
  <g transform="translate(520, 160)">
    <rect x="0" y="0" width="40" height="60" fill="#C15F3C" opacity="0.3" stroke="#C15F3C" stroke-width="1"/>
    <rect x="40" y="0" width="40" height="60" fill="#C15F3C" opacity="0.2" stroke="#C15F3C" stroke-width="1"/>
    <rect x="80" y="0" width="40" height="60" fill="#C15F3C" opacity="0.2" stroke="#C15F3C" stroke-width="1"/>
    <rect x="0" y="60" width="40" height="60" fill="#C15F3C" opacity="0.2" stroke="#C15F3C" stroke-width="1"/>
    <rect x="40" y="60" width="40" height="60" fill="#C15F3C" opacity="0.2" stroke="#C15F3C" stroke-width="1"/>
    <rect x="80" y="60" width="40" height="60" fill="#C15F3C" opacity="0.2" stroke="#C15F3C" stroke-width="1"/>
    <rect x="0" y="120" width="40" height="60" fill="#C15F3C" opacity="0.2" stroke="#C15F3C" stroke-width="1"/>
    <rect x="40" y="120" width="40" height="60" fill="#C15F3C" opacity="0.2" stroke="#C15F3C" stroke-width="1"/>
    <rect x="80" y="120" width="40" height="60" fill="#C15F3C" opacity="0.2" stroke="#C15F3C" stroke-width="1"/>
    <text x="60" y="200" font-family="Georgia, serif" font-size="14" fill="#5a4a3a" text-anchor="middle">A tiles</text>
  </g>

  <!-- Multiplication symbol -->
  <text x="670" y="260" font-family="Georgia, serif" font-size="32" fill="#C15F3C" text-anchor="middle">×</text>

  <!-- Tiled Matrix B -->
  <g transform="translate(700, 160)">
    <rect x="0" y="0" width="60" height="40" fill="#C15F3C" opacity="0.3" stroke="#C15F3C" stroke-width="1"/>
    <rect x="60" y="0" width="60" height="40" fill="#C15F3C" opacity="0.2" stroke="#C15F3C" stroke-width="1"/>
    <rect x="120" y="0" width="60" height="40" fill="#C15F3C" opacity="0.2" stroke="#C15F3C" stroke-width="1"/>
    <rect x="0" y="40" width="60" height="40" fill="#C15F3C" opacity="0.2" stroke="#C15F3C" stroke-width="1"/>
    <rect x="60" y="40" width="60" height="40" fill="#C15F3C" opacity="0.2" stroke="#C15F3C" stroke-width="1"/>
    <rect x="120" y="40" width="60" height="40" fill="#C15F3C" opacity="0.2" stroke="#C15F3C" stroke-width="1"/>
    <rect x="0" y="80" width="60" height="40" fill="#C15F3C" opacity="0.2" stroke="#C15F3C" stroke-width="1"/>
    <rect x="60" y="80" width="60" height="40" fill="#C15F3C" opacity="0.2" stroke="#C15F3C" stroke-width="1"/>
    <rect x="120" y="80" width="60" height="40" fill="#C15F3C" opacity="0.2" stroke="#C15F3C" stroke-width="1"/>
    <text x="90" y="140" font-family="Georgia, serif" font-size="14" fill="#5a4a3a" text-anchor="middle">B tiles</text>
  </g>

  <!-- Result tile highlight -->
  <g transform="translate(620, 350)">
    <rect x="0" y="0" width="60" height="60" fill="#C15F3C" opacity="0.6" stroke="#C15F3C" stroke-width="2"/>
    <rect x="60" y="0" width="60" height="60" fill="#C15F3C" opacity="0.2" stroke="#C15F3C" stroke-width="1"/>
    <rect x="120" y="0" width="60" height="60" fill="#C15F3C" opacity="0.2" stroke="#C15F3C" stroke-width="1"/>
    <rect x="0" y="60" width="60" height="60" fill="#C15F3C" opacity="0.2" stroke="#C15F3C" stroke-width="1"/>
    <rect x="60" y="60" width="60" height="60" fill="#C15F3C" opacity="0.2" stroke="#C15F3C" stroke-width="1"/>
    <rect x="120" y="60" width="60" height="60" fill="#C15F3C" opacity="0.2" stroke="#C15F3C" stroke-width="1"/>
    <rect x="0" y="120" width="60" height="60" fill="#C15F3C" opacity="0.2" stroke="#C15F3C" stroke-width="1"/>
    <rect x="60" y="120" width="60" height="60" fill="#C15F3C" opacity="0.2" stroke="#C15F3C" stroke-width="1"/>
    <rect x="120" y="120" width="60" height="60" fill="#C15F3C" opacity="0.2" stroke="#C15F3C" stroke-width="1"/>
    <text x="90" y="200" font-family="Georgia, serif" font-size="14" fill="#5a4a3a" text-anchor="middle">C tiles</text>
  </g>

  <!-- One tile computation callout -->
  <rect x="880" y="200" width="280" height="160" fill="#fff" stroke="#C15F3C" stroke-width="2" rx="8"/>
  <text x="1020" y="230" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#C15F3C" text-anchor="middle">One Tile Computation</text>
  <text x="900" y="260" font-family="Georgia, serif" font-size="13" fill="#5a4a3a">C[i,j] = Σ A[i,k] × B[k,j]</text>
  <text x="900" y="285" font-family="Georgia, serif" font-size="13" fill="#5a4a3a">• Load A tile to fast memory</text>
  <text x="900" y="305" font-family="Georgia, serif" font-size="13" fill="#5a4a3a">• Load B tile to fast memory</text>
  <text x="900" y="325" font-family="Georgia, serif" font-size="13" fill="#5a4a3a">• Compute partial C tile</text>
  <text x="900" y="345" font-family="Georgia, serif" font-size="13" fill="#5a4a3a">• Accumulate results</text>

  <!-- Arrow from tile to callout -->
  <line x1="680" y1="380" x2="875" y2="280" stroke="#C15F3C" stroke-width="2" stroke-dasharray="5,3"/>

  <!-- Bottom section: The Trade-off -->
  <rect x="50" y="560" width="1100" height="200" fill="#e8e4dc" stroke="#C15F3C" stroke-width="2" rx="10"/>
  <text x="600" y="595" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#C15F3C" text-anchor="middle">The Critical Trade-off: Tile Size Selection</text>

  <!-- Too Small -->
  <g transform="translate(100, 620)">
    <rect x="0" y="0" width="300" height="120" fill="#fff" stroke="#C15F3C" stroke-width="1" rx="5"/>
    <text x="150" y="30" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#C15F3C" text-anchor="middle">Tiles Too Small</text>
    <text x="20" y="55" font-family="Georgia, serif" font-size="13" fill="#5a4a3a">✗ High loop overhead</text>
    <text x="20" y="75" font-family="Georgia, serif" font-size="13" fill="#5a4a3a">✗ Many memory transfers</text>
    <text x="20" y="95" font-family="Georgia, serif" font-size="13" fill="#5a4a3a">✗ Underutilize compute units</text>
    <text x="20" y="115" font-family="Georgia, serif" font-size="13" fill="#8a2a0a">→ Slow execution</text>
  </g>

  <!-- Just Right -->
  <g transform="translate(450, 620)">
    <rect x="0" y="0" width="300" height="120" fill="#d4c4b0" stroke="#C15F3C" stroke-width="3" rx="5"/>
    <text x="150" y="30" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#C15F3C" text-anchor="middle">Optimal Tile Size</text>
    <text x="20" y="55" font-family="Georgia, serif" font-size="13" fill="#5a4a3a">✓ Balance compute vs memory</text>
    <text x="20" y="75" font-family="Georgia, serif" font-size="13" fill="#5a4a3a">✓ Maximize data reuse</text>
    <text x="20" y="95" font-family="Georgia, serif" font-size="13" fill="#5a4a3a">✓ Fit in fast memory (HBM)</text>
    <text x="20" y="115" font-family="Georgia, serif" font-size="13" fill="#2a6a2a">→ Maximum throughput</text>
  </g>

  <!-- Too Large -->
  <g transform="translate(800, 620)">
    <rect x="0" y="0" width="300" height="120" fill="#fff" stroke="#C15F3C" stroke-width="1" rx="5"/>
    <text x="150" y="30" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#C15F3C" text-anchor="middle">Tiles Too Large</text>
    <text x="20" y="55" font-family="Georgia, serif" font-size="13" fill="#5a4a3a">✗ Exceed fast memory capacity</text>
    <text x="20" y="75" font-family="Georgia, serif" font-size="13" fill="#5a4a3a">✗ Cause memory spills</text>
    <text x="20" y="95" font-family="Georgia, serif" font-size="13" fill="#5a4a3a">✗ Poor parallelism</text>
    <text x="20" y="115" font-family="Georgia, serif" font-size="13" fill="#8a2a0a">→ Memory bottleneck</text>
  </g>
</svg>