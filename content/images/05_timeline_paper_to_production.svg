<svg width="1200" height="500" viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="500" fill="#F4F3EE"/>

  <!-- Title -->
  <text x="600" y="50" font-family="Georgia, serif" font-size="36" font-weight="400" fill="#1A1612" text-anchor="middle">Flash Attention: Paper to Production</text>
  <text x="600" y="85" font-family="Georgia, serif" font-size="18" fill="#5C534A" text-anchor="middle" font-style="italic">The human bottleneck in AI deployment</text>

  <!-- Decorative line -->
  <line x1="400" y1="105" x2="800" y2="105" stroke="#E5E2DC" stroke-width="1"/>

  <!-- Timeline base -->
  <line x1="120" y1="250" x2="1080" y2="250" stroke="#B1ADA1" stroke-width="2"/>

  <!-- Milestone 1: Paper -->
  <g transform="translate(180, 250)">
    <circle cx="0" cy="0" r="12" fill="#FFFFFF" stroke="#5C534A" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#5C534A"/>

    <line x1="0" y1="-18" x2="0" y2="-70" stroke="#5C534A" stroke-width="1"/>
    <rect x="-80" y="-135" width="160" height="60" rx="4" fill="#FFFFFF" stroke="#E5E2DC" stroke-width="1"/>
    <text x="0" y="-105" font-family="Georgia, serif" font-size="15" font-weight="600" fill="#1A1612" text-anchor="middle">May 2022</text>
    <text x="0" y="-82" font-family="Georgia, serif" font-size="13" fill="#5C534A" text-anchor="middle">Paper on arXiv</text>

    <text x="0" y="45" font-family="Georgia, serif" font-size="12" fill="#8C8279" text-anchor="middle">Tri Dao</text>
    <text x="0" y="60" font-family="Georgia, serif" font-size="12" fill="#8C8279" text-anchor="middle">publishes</text>
  </g>

  <!-- Milestone 2: First Implementations -->
  <g transform="translate(440, 250)">
    <circle cx="0" cy="0" r="12" fill="#FFFFFF" stroke="#5C534A" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#5C534A"/>

    <line x1="0" y1="18" x2="0" y2="70" stroke="#5C534A" stroke-width="1"/>
    <rect x="-80" y="75" width="160" height="60" rx="4" fill="#FFFFFF" stroke="#E5E2DC" stroke-width="1"/>
    <text x="0" y="105" font-family="Georgia, serif" font-size="15" font-weight="600" fill="#1A1612" text-anchor="middle">Aug 2022</text>
    <text x="0" y="125" font-family="Georgia, serif" font-size="13" fill="#5C534A" text-anchor="middle">First implementations</text>

    <text x="0" y="-35" font-family="Georgia, serif" font-size="12" fill="#8C8279" text-anchor="middle">Early adopters</text>
    <text x="0" y="-20" font-family="Georgia, serif" font-size="12" fill="#8C8279" text-anchor="middle">experiment</text>
  </g>

  <!-- Milestone 3: PyTorch Integration -->
  <g transform="translate(720, 250)">
    <circle cx="0" cy="0" r="12" fill="#FFFFFF" stroke="#5C534A" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#5C534A"/>

    <line x1="0" y1="-18" x2="0" y2="-70" stroke="#5C534A" stroke-width="1"/>
    <rect x="-80" y="-135" width="160" height="60" rx="4" fill="#FFFFFF" stroke="#E5E2DC" stroke-width="1"/>
    <text x="0" y="-105" font-family="Georgia, serif" font-size="15" font-weight="600" fill="#1A1612" text-anchor="middle">2023</text>
    <text x="0" y="-82" font-family="Georgia, serif" font-size="13" fill="#5C534A" text-anchor="middle">PyTorch integration</text>

    <text x="0" y="45" font-family="Georgia, serif" font-size="12" fill="#8C8279" text-anchor="middle">SDPA added</text>
    <text x="0" y="60" font-family="Georgia, serif" font-size="12" fill="#8C8279" text-anchor="middle">to core</text>
  </g>

  <!-- Milestone 4: Production Use -->
  <g transform="translate(1000, 250)">
    <circle cx="0" cy="0" r="14" fill="#C15F3C" stroke="#C15F3C" stroke-width="2"/>
    <circle cx="0" cy="0" r="6" fill="#FFFFFF"/>

    <line x1="0" y1="20" x2="0" y2="70" stroke="#C15F3C" stroke-width="1"/>
    <rect x="-90" y="75" width="180" height="60" rx="4" fill="#FBF7F4" stroke="#C15F3C" stroke-width="1"/>
    <text x="0" y="105" font-family="Georgia, serif" font-size="15" font-weight="600" fill="#C15F3C" text-anchor="middle">Late 2023</text>
    <text x="0" y="125" font-family="Georgia, serif" font-size="13" fill="#5C534A" text-anchor="middle">Production deployment</text>

    <text x="0" y="-35" font-family="Georgia, serif" font-size="12" fill="#8C8279" text-anchor="middle">Finally deployed</text>
    <text x="0" y="-20" font-family="Georgia, serif" font-size="12" fill="#8C8279" text-anchor="middle">at scale</text>
  </g>

  <!-- Duration bracket -->
  <g transform="translate(180, 290)">
    <path d="M 0,20 L 0,40 L 820,40 L 820,20" stroke="#C15F3C" stroke-width="1.5" fill="none"/>
    <line x1="410" y1="40" x2="410" y2="65" stroke="#C15F3C" stroke-width="1.5"/>
    <rect x="290" y="70" width="240" height="45" rx="4" fill="#FBF7F4" stroke="#C15F3C" stroke-width="1"/>
    <text x="410" y="100" font-family="Georgia, serif" font-size="22" font-weight="600" fill="#C15F3C" text-anchor="middle">12+ months</text>
  </g>

  <!-- Key insight -->
  <rect x="200" y="420" width="800" height="55" rx="4" fill="#FFFFFF" stroke="#E5E2DC" stroke-width="1"/>
  <text x="600" y="455" font-family="Georgia, serif" font-size="16" fill="#5C534A" text-anchor="middle">
    <tspan font-weight="600" fill="#C15F3C" font-style="italic">And Flash Attention is one of the faster adoptions.</tspan>
    <tspan> Many breakthroughs take 2–3 years.</tspan>
  </text>
</svg>