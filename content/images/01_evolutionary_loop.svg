<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow1" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#C15F3C"/>
    </marker>
    <marker id="arrow2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#5C534A"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="#F4F3EE"/>

  <!-- Title -->
  <text x="600" y="60" font-family="Georgia, serif" font-size="36" font-weight="400" fill="#1A1612" text-anchor="middle">The Evolutionary Loop</text>
  <text x="600" y="95" font-family="Georgia, serif" font-size="18" fill="#5C534A" text-anchor="middle" font-style="italic">LLM-Guided Kernel Configuration Search</text>

  <!-- Subtle decorative line -->
  <line x1="400" y1="115" x2="800" y2="115" stroke="#E5E2DC" stroke-width="1"/>

  <!-- Node 1: Population (top) -->
  <g transform="translate(600, 200)">
    <rect x="-110" y="-40" width="220" height="80" rx="4" fill="#FFFFFF" stroke="#E5E2DC" stroke-width="1"/>
    <text x="0" y="-8" font-family="Georgia, serif" font-size="16" font-weight="600" fill="#1A1612" text-anchor="middle">Population</text>
    <text x="0" y="16" font-family="Georgia, serif" font-size="14" fill="#5C534A" text-anchor="middle">of Configurations</text>
  </g>

  <!-- Node 2: LLM Mutations (right) -->
  <g transform="translate(850, 380)">
    <rect x="-110" y="-40" width="220" height="80" rx="4" fill="#FFFFFF" stroke="#C15F3C" stroke-width="2"/>
    <text x="0" y="-8" font-family="Georgia, serif" font-size="16" font-weight="600" fill="#C15F3C" text-anchor="middle">LLM-Guided</text>
    <text x="0" y="16" font-family="Georgia, serif" font-size="14" fill="#5C534A" text-anchor="middle">Mutations</text>
  </g>

  <!-- Node 3: Compile (bottom-right) -->
  <g transform="translate(750, 560)">
    <rect x="-90" y="-40" width="180" height="80" rx="4" fill="#FFFFFF" stroke="#E5E2DC" stroke-width="1"/>
    <text x="0" y="-8" font-family="Georgia, serif" font-size="16" font-weight="600" fill="#1A1612" text-anchor="middle">Compile</text>
    <text x="0" y="16" font-family="Georgia, serif" font-size="14" fill="#5C534A" text-anchor="middle">Helion → Triton</text>
  </g>

  <!-- Node 4: Benchmark (bottom) - emphasized -->
  <g transform="translate(600, 650)">
    <rect x="-120" y="-50" width="240" height="100" rx="4" fill="#FBF7F4" stroke="#C15F3C" stroke-width="2"/>
    <text x="0" y="-15" font-family="Georgia, serif" font-size="18" font-weight="600" fill="#1A1612" text-anchor="middle">Benchmark</text>
    <text x="0" y="10" font-family="Georgia, serif" font-size="14" fill="#5C534A" text-anchor="middle">on Real Hardware</text>
    <text x="0" y="32" font-family="Georgia, serif" font-size="13" fill="#C15F3C" text-anchor="middle" font-style="italic">Every. Single. Time.</text>
  </g>

  <!-- Node 5: Select Winners (bottom-left) -->
  <g transform="translate(450, 560)">
    <rect x="-90" y="-40" width="180" height="80" rx="4" fill="#FFFFFF" stroke="#E5E2DC" stroke-width="1"/>
    <text x="0" y="-8" font-family="Georgia, serif" font-size="16" font-weight="600" fill="#1A1612" text-anchor="middle">Select</text>
    <text x="0" y="16" font-family="Georgia, serif" font-size="14" fill="#5C534A" text-anchor="middle">Winners</text>
  </g>

  <!-- Connecting lines with arrows -->
  <!-- 1 → 2 -->
  <path d="M 710 200 Q 820 240 840 340" stroke="#5C534A" stroke-width="2" fill="none" marker-end="url(#arrow2)"/>

  <!-- 2 → 3 -->
  <path d="M 850 420 Q 830 480 765 520" stroke="#5C534A" stroke-width="2" fill="none" marker-end="url(#arrow2)"/>

  <!-- 3 → 4 -->
  <path d="M 680 560 Q 650 590 640 600" stroke="#5C534A" stroke-width="2" fill="none" marker-end="url(#arrow2)"/>

  <!-- 4 → 5 -->
  <path d="M 520 600 Q 490 590 470 560" stroke="#5C534A" stroke-width="2" fill="none" marker-end="url(#arrow2)"/>

  <!-- 5 → 1 -->
  <path d="M 380 520 Q 320 380 490 220" stroke="#C15F3C" stroke-width="2" fill="none" marker-end="url(#arrow1)"/>

  <!-- Center label -->
  <text x="600" y="420" font-family="Georgia, serif" font-size="20" fill="#C15F3C" text-anchor="middle" font-style="italic">repeat</text>
  <text x="600" y="445" font-family="Georgia, serif" font-size="14" fill="#8C8279" text-anchor="middle">~100 iterations</text>

  <!-- Key insight at bottom -->
  <rect x="200" y="740" width="800" height="45" rx="2" fill="#FFFFFF" stroke="#E5E2DC" stroke-width="1"/>
  <text x="600" y="770" font-family="Georgia, serif" font-size="15" fill="#5C534A" text-anchor="middle">
    <tspan font-weight="600" fill="#C15F3C">Key Insight:</tspan>
    <tspan> No synthetic benchmarks. No performance models. Real hardware feedback.</tspan>
  </text>
</svg>